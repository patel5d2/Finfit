<div id="link-account-modal" class="modal fade" tabindex="-1" aria-labelledby="linkAccountModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="linkAccountModalLabel">Link Bank Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="link-account-form">
                    <div class="mb-3">
                        <label for="bank-name" class="form-label">Bank Name</label>
                        <input type="text" class="form-control" id="bank-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Link Account</button>
                </form>
            </div>
        </div>
    </div>
</div>

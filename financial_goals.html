<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FinFit: Financial Goals</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.2/css/bootstrap.min.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Financial Goals</h1>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title mb-0">Your Goals</h3>
                        <button id="create-goal-btn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#create-goal-modal">Create Goal</button>
                    </div>
                    <div class="card-body">
                        <ul id="goals-list" class="list-group">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <div id="create-goal-modal" class="modal fade" tabindex="-1" aria-labelledby="createGoalModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createGoalModalLabel">Create Goal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="create-goal-form">
                        <div class="mb-3">
                            <label for="goal-name" class="form-label">Goal Name</label>
                            <input type="text" class="form-control" id="goal-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="goal-amount" class="form-label">Goal Amount</label>
                            <input type="number" class="form-control" id="goal-amount" required>
                        </div>
                        <div class="mb-3">
                            <label for="current-amount" class="form-label">Current Amount</label>
                            <input type="number" class="form-control" id="current-amount" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Goal</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.2/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/financial_goals.js"></script>
    <script>
        function loadComponent(url, placeholderId) {
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(placeholderId).innerHTML = data;
                });
        }

        loadComponent('_header.html', 'header-placeholder');
        loadComponent('_footer.html', 'footer-placeholder');
    </script>
</body>
</html>

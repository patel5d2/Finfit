<div id="budget-modal" class="modal fade" tabindex="-1" aria-labelledby="budgetModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="budgetModalLabel">Create Budget</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="budget-form">
                    <div class="mb-3">
                        <label for="budget-category" class="form-label">Category</label>
                        <select class="form-select" id="budget-category">
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="budget-amount" class="form-label">Amount</label>
                        <input type="number" class="form-control" id="budget-amount" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Budget</button>
                </form>
            </div>
        </div>
    </div>
</div>

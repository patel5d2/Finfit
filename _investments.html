<div id="investments-modal" class="modal fade" tabindex="-1" aria-labelledby="investmentsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="investmentsModalLabel">Add Investment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="investment-form">
                    <div class="mb-3">
                        <label for="investment-name" class="form-label">Investment Name</label>
                        <input type="text" class="form-control" id="investment-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="investment-amount" class="form-label">Amount</label>
                        <input type="number" class="form-control" id="investment-amount" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Investment</button>
                </form>
            </div>
        </div>
    </div>
</div>

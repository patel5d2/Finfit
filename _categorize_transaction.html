<div id="categorize-transaction-modal" class="modal fade" tabindex="-1" aria-labelledby="categorizeTransactionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categorizeTransactionModalLabel">Categorize Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="categorize-transaction-form">
                    <div class="mb-3">
                        <label for="transaction-description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="transaction-description" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="transaction-category" class="form-label">Category</label>
                        <select class="form-select" id="transaction-category">
                            <option value="Income">Income</option>
                            <option value="Bills">Bills</option>
                            <option value="Cash">Cash</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <input type="hidden" id="transaction-id">
                    <button type="submit" class="btn btn-primary">Save Category</button>
                </form>
            </div>
        </div>
    </div>
</div>

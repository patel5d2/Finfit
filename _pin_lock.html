<div id="pin-lock-modal" class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="pinLockModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="pinLockModalLabel">Enter PIN</h5>
            </div>
            <div class="modal-body">
                <form id="pin-form">
                    <div class="mb-3">
                        <label for="pin-input" class="form-label">PIN</label>
                        <input type="password" class="form-control" id="pin-input" maxlength="4" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Unlock</button>
                </form>
            </div>
        </div>
    </div>
</div>
